<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- Player -->
        <div id="music-player">
            <img id="song-image" src="" alt="Album Cover">
            <div id="song-name">No song selected</div>
            <div id="song-artist">—</div>
            <label for="song-slider">Song progress</label>
            <input id="song-slider" type="range" value="0" aria-label="Song progress">

            <div id="music-buttons">
                <button id="shuffle-button">Shuffle</button>
                <button id="prev-button">Prev</button>
                <button id="play-button">Play</button>
                <button id="next-button">Next</button>
                <button id="repeat-button">Repeat</button>
            </div>
        </div>

        <!-- Sidebar -->
        <div id="sidebar">

            <div id="playlist-header">
                <div id="playlist-tabs"></div>
                <button id="new-playlist-btn">＋</button>
            </div>

            <!-- New playlist form (hidden by default) -->
            <div id="new-playlist-form" class="hidden">
                <input id="playlist-name-input" type="text" placeholder="Playlist name...">
                <div id="form-buttons">
                    <button id="confirm-playlist-btn">Create</button>
                    <button id="cancel-playlist-btn">Cancel</button>
                </div>
            </div>

            <ul id="song-list"></ul>

            <div id="upload-area">
                <label for="file-input">＋ Add MP3 to playlist</label>
                <input id="file-input" type="file" accept=".mp3,audio/*" multiple>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
