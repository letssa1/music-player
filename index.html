<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">


        <div id="music-player">
            <img id="song-image" src="" alt="Album Cover">
            <div id="song-name">name</div>
            <div id="song-artist">artist</div>
            <label for="song-slider">Song progress</label>
            <input id="song-slider" type="range" aria-label="Song progress">

            <div id="music-buttons">
                <button id="shuffle-button">Shuffle</button>
                <button id="prev-button">Prev</button>
                <button id="play-button">Play</button>
                <button id="next-button">Next</button>
                <button id="repeat-button">Repeat</button>
            </div>
        </div>

        
        <div id="sidebar">

          
            <div id="playlist-tabs">
                <button class="tab-button active" data-playlist="jazz">Jazz</button>
                <button class="tab-button" data-playlist="classical">Classical</button>
            </div>

           
            <ul id="song-list"></ul>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
